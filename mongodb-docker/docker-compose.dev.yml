services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    # can remove the container name
    # container_name: mongodb-09march26
    restart: always
    env_file:
      - ${ENV_PATH:-./.env.development}
    ports:
      - '${MONGO_PORT_HOST}:27017'
    volumes:
      - ./mongo-data:/data/db
    networks:
      - network-name

  mongo-express:
    image: mongo-express:latest
    # can remove the container name
    # container_name: mongo-express-09march26
    restart: always
    ports:
      - '${ME_PORT_HOST}:${ME_PORT_CONTAINER}'
    env_file:
      - ${ENV_PATH:-./.env.development}
    depends_on:
      - mongodb
    networks:
      - network-name

networks:
  network-name:
    external: true
    name: shared-network-name
    # driver: bridge
